<html lang="en">
<head>
    <title>Data Pulling</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
    <h1>Pokemon Roster Picker</h1>
    <select id="pokeSelect">
        <option value="Char">Charmander</option>
        <option value="Squi">Squirtle</option>
        <option value="Pika">Pikachu</option>
        <option value="Bulb">Bulbasaur</option>
    </select>

    <div id="pokemons">
        <ul id="pokeList"></ul>
    </div>

    <div id="pokeStats">
        <p>Total Max HP:</p>
        <p id="maxHP"></p>
        <p>Average Attack:</p>
        <p id="avgATK"></p>
    </div>
</main>
<script src="javascript.js"></script>
</body>
</html>
